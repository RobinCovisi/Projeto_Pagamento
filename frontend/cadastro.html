<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Pagamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Usuário</h2>

        <div id="error" class="error"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processando...</p>
        </div>

        <form id="formCadastro">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" required>

            <label for="estado_civil">Estado Civil *</label>
            <select id="estado_civil" required>
                <option value="">Selecione...</option>
                <option value="Solteiro">Solteiro(a)</option>
                <option value="Casado">Casado(a)</option>
                <option value="Divorciado">Divorciado(a)</option>
                <option value="Viúvo">Viúvo(a)</option>
            </select>

            <label for="data_nascimento">Data de Nascimento *</label>
            <input type="date" id="data_nascimento" required>

            <label for="cep">CEP *</label>
            <input type="text" id="cep" placeholder="Digite seu CEP (ex: 01001000)" required>

            <label for="rua">Rua *</label>
            <input type="text" id="rua" placeholder="Rua será preenchida automaticamente" required readonly>

            <label for="numero">Número *</label>
            <input type="text" id="numero" placeholder="Digite o número da residência" required>

            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" placeholder="Apto, sala, etc. (opcional)">

            <label for="cidade">Cidade *</label>
            <input type="text" id="cidade" placeholder="Cidade será preenchida automaticamente" required readonly>

            <label for="estado">Estado *</label>
            <input type="text" id="estado" placeholder="Estado será preenchido automaticamente" required readonly>

            <button type="submit">Continuar para Pagamento</button>
        </form>
    </div>

    <script src="js/cadastro.js"></script>
</body>
</html>
