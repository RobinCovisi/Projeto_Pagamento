<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Sistema de Pagamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Dados do Pagamento</h2>

        <div class="info-box">
            <strong>ℹ️ Informação:</strong> Para testar, use um cartão que NÃO termine em 0 e CVV diferente de 000.
        </div>

        <div id="error" class="error"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processando pagamento...</p>
        </div>

        <form id="formPagamento">
            <label for="numero_cartao">Número do Cartão *</label>
            <input 
                type="text" 
                id="numero_cartao" 
                placeholder="0000 0000 0000 0000" 
                maxlength="19"
                required>

            <label for="nome_titular">Nome do Titular *</label>
            <input 
                type="text" 
                id="nome_titular" 
                placeholder="Digite o nome como aparece no cartão" 
                required>

            <label for="mes">Mês de Validade *</label>
            <input 
                type="number" 
                id="mes" 
                placeholder="MM (01-12)" 
                min="1" 
                max="12" 
                required>

            <label for="ano">Ano de Validade *</label>
            <input 
                type="number" 
                id="ano" 
                placeholder="YYYY" 
                min="2024" 
                required>

            <label for="cvv">CVV *</label>
            <input 
                type="text" 
                id="cvv" 
                placeholder="000" 
                maxlength="4" 
                required>

            <button type="submit">Processar Pagamento</button>
            <button type="button" class="button-secondary" onclick="voltar()">Voltar</button>
        </form>
    </div>

    <script src="js/pagamento.js"></script>
</body>
</html>
